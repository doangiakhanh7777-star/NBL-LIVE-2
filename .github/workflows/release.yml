name: Phat hanh ban cai
on:
  push:
    branches: [upload]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upload
      - name: Ghep va kiem ma
        run: |
          set -e
          . ./release.env
          cat parts/setup.part.* > "$SETUP"
          echo "$SETUP_SHA256  $SETUP" | sha256sum -c -
          echo "$SETUP_SHA256  $SETUP" > "$SETUP.sha256"
          FILES="$SETUP $SETUP.sha256"
          if ls parts/apk.part.* >/dev/null 2>&1; then
            cat parts/apk.part.* > "$APK"
            echo "$APK_SHA256  $APK" | sha256sum -c -
            FILES="$FILES $APK"
          fi
          echo "FILES=$FILES" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
      - name: Tao release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" $FILES --repo "$GITHUB_REPOSITORY" --target main --title "$TITLE" --notes-file notes.md --latest
